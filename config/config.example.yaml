# Copy to config/config.yaml (git-ignored) and adjust.

node:
  host: 192.168.1.20      # Eurolite DXT PoE Art-Net Node I (factory IP, sticker on the underside)
  port: 6454
  net: 0                  # Art-Net Net / SubNet / Universe as set on the node's web page
  subnet: 0
  universe: 1             # node factory default is Art-Net Universe 1 (Port 1)

output:
  rate_hz: 30             # DMX frame rate; node refresh should be set equal or higher

audio:
  device: "@DEFAULT_MONITOR@"   # monitor of the current default output (follows speaker/mixer switch)
  sample_rate: 48000
  block_size: 1024              # 21 ms per block
  latency_ms: 20

show:
  beat_lead_ms: 30        # fire beat effects this much early to cancel pipeline latency (tune by camera)
  max_flash_hz: 8         # hard cap on dimmer-pulse flashes per second (<= 10)
  flash_decay_ms: 70
  master: 0.8             # overall brightness ceiling (+/- keys change it live)
  pan_limits: [0.2, 0.8]  # normalised range the moving head may use (keep the beam off faces)
  tilt_limits: [0.3, 0.8]
  scene: auto             # auto | beat | ambient | drive
  colour_hold_s: 1.5      # min time between colour-wheel changes (mechanical)
  silence_fade_s: 2.0
  flash_gate: 0.35        # no beat flash below this bass energy (breakdowns stay dark); 0 = always
  kick_flash_strength: 0.6   # strong bass hits between grid beats also flash; >1 disables this
  ambient_flash_energy: 0.75 # in the ambient scene only very strong bass hits flash (drops)
  ambient_flash_rise_db: 6   # ...and only real transients (bass jump in dB)
  ambient_flash_hz: 3
  drive_kick_rate: 2.0       # kicks/s that mark kick-dense music (frenchcore): "drive" scene
  drive_energy: 0.2          # ...with at least this bass energy (distorted kicks live above 150 Hz)
  drive_flash_gate: 0.25     # drive scene: flash on kick events if bass energy is at least this
  drive_min_confidence: 0.15 # ...and some periodicity (rules out pure noise)
  mover_flash_every: 4       # every 4th flash event the moving head flashes too (0 = never)
  breath_period_s: 7         # ambient scene: moving head brightness breathes at this period
  breath_depth: 0.6          # ...dipping to (1 - depth) of its level (0 = no breathing)

# Profiles are looked up in config/fixtures/<profile>.json
fixtures:
  - name: mover1
    profile: picospot20_9ch
    address: 1
    group: movers
  - name: strobe1
    profile: potstrobe100_3ch
    address: 10
    group: strobes
